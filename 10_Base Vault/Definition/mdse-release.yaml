# MDSE release manifest (W-320, W-321, W-322).
# Single machine-readable authority for release alignment and the lean runtime-base build.
# This file stays in the methodology workspace; it is NOT copied into generated engineering vaults.
# Verify with:
#   python3 "Base Vault/Testing/check-release.py" [--workbench <path>] [--base <path>]
manifestVersion: 2
mdseRelease: "0.8.0"
releaseStatus: pre-release
date: "2026-10-05"
sourceModelId: EA8647

schemas:
  relationships: "1.36"
  elementTypes: "1.18"
  localModel: "0.5"

ruleset: "99_System/10_Docs/MDSE Modeling Ruleset 1.23.md"

limits:
  fsComponentMaxBytes: 255               # W-382: physical filesystem component limit only
  generatedPathLengthLimit: null         # W-382: no importer-defined total path-length limit
  modelFilesPerFolderLimit: null         # W-382: no importer-defined folder file-count limit
  importedFileNameScope: global          # W-382: case-insensitive, existing base/system note basenames reserved first
  nestedElementFolders: true             # W-382: Parent.md beside Parent/Child.md
  duplicateMarker: "~2"
  alterationMarker: "~a"

tools:
  importer:
    release: null
    candidate: "Importer/Tools/v0.8.19/EA_to_MDSE_Native_Importer_v0.8.19.html"
    candidateVersion: "0.8.19"
    sourceProfile: "Importer/Definition/Source Profiles/EA8647-2026-09-06-v1.json"
    sourceProfileSync: "Importer/Tools/v0.8.19/sync_source_profile.py"
    attachmentBenchmark: "Importer/Testing/v0.8.6/attachment_benchmark.json"
    history: "Importer/History/Importer Revisions"   # v0.1 to v0.7 and v0.8.0 to v0.8.5 (W-326); none may generate a model
  cleanBase:
    repo: null
    builder: "Base Vault/Tools/v0.8.0-r2/build-base.py"
    obsoleteReference: "spencerskelly/Test_Vault_-base-vault-2026-09-30-rel133-v051"
  workbench:
    repo: "spencerskelly/Test_Vault_"
    version: "0.1.18"                               # W-386: first WB-106-capable controlled Workbench release
    candidateVersion: null
    nextGate: "Golden-model integration / Bootstrap first-open"
    wb106Version: "0.1.18"                          # required Workbench release for the issued 0.8.0 base
    runtimePluginId: "mdse-workbench"
    requiredForRelease: true
    fixturesFrom: "99_System/03_Schemas"
    userGuide: "Base Vault/Definition/MDSE Workbench User Guide.md"  # W-341; exact copy of standalone Workbench guide
  bootstrap:
    status: active                                  # rebuilt by W-322 (replaces the unavailable 0.2.0 of W-321)
    version: "0.3.0"
    source: "Bootstrap/Tools/v0.3.0"               # pinned runtime source
    candidateSource: "Bootstrap/Tools/v0.3.1"       # W-330 safe activation repair; not promoted yet
    sourceAvailable: true
    role: "safe activation repair + controlled-release check against plugin-lock.yaml; author registration (Author Registration Spec)"

# W-322: controlled plugin release. Every runtime plugin ships inside the base, pinned and hashed.
runtimePlugins:
  lock: ".obsidian/plugin-lock.yaml"                # generated by update-plugin-lock.py; runtime authority
  enabledList: ".obsidian/community-plugins.json"   # generated with the lock
  payload: "Base Vault/Runtime/Plugins"     # vendored/built plugin files + governed data.json
  configGenerator: "Base Vault/Tools/v0.8.0-r2/build-plugin-config.py"
  lockGenerator: "Base Vault/Tools/v0.8.0-r2/update-plugin-lock.py"

repos:
  authority: "spencerskelly/Test_Vault_"
  workbench: "spencerskelly/Test_Vault_"
  referenceOnly:
    - "spencerskelly/20260930"
    - "spencerskelly/261001"
    - "spencerskelly/Test_Vault_-base-vault-2026-09-30-rel133-v051"

# W-321: the engineering vault is a lean runtime artifact, not another methodology workspace.
# Positive include lists avoid carrying workspace-only material accidentally.
runtimeBase:
  policy: lean
  copyReleaseManifest: false
  copyCurrentState: false
  generatedFiles:
    - ".vault.yaml"
    - "README.md"
    - ".gitignore"                                  # base policy: governed plugin settings are tracked
  includeFiles:
    - ".gitattributes"
    - "AGENTS.md"
    - ".obsidian/app.json"
    - ".obsidian/appearance.json"
    - ".obsidian/community-plugins.json"
    - ".obsidian/core-plugins.json"
    - ".obsidian/plugin-lock.yaml"
    - ".obsidian/templates.json"
    - ".obsidian/types.json"
    - "99_System/03_Schemas/authors.yaml"
    - "99_System/03_Schemas/element-types.yaml"
    - "99_System/03_Schemas/local-model.yaml"
    - "99_System/03_Schemas/relationships.yaml"
    - "99_System/10_Docs/MDSE Modeling Ruleset 1.23.md"
  includeTrees:
    - "Definitions"
    - "99_System/02_AI"
    - "99_System/04_People"
    - "99_System/05_Templates"
    - "99_System/06_Fileclasses"
    - "99_System/08_Scripts"
  mappedFiles:
    - {source: "Base Vault/Definition/Enabled Plugin Stack.md", target: "99_System/01_Admin/Enabled Plugin Stack.md"}
    - {source: "Base Vault/Definition/MDSE Workbench User Guide.md", target: "99_System/01_Admin/MDSE Workbench User Guide.md"}
    - {source: "Base Vault/Initialization/Initialize-Vault.ps1", target: "Initialize-Vault.ps1"}
    - {source: "Base Vault/Initialization/Initialize-Vault.sh", target: "Initialize-Vault.sh"}
  conditionalFiles: []
  forbiddenPaths:
    - "Base Vault/Definition/mdse-release.yaml"
    - "00_Workspace/00 - Current State.md"
    - "Importer/Definition/Translator Definition.md"
    - "00_Workspace/Workspace Decision Log.md"
    - "Importer/Testing/EA Source Evidence"
    - "Importer/History"
    - "00_Workspace/History"
    - "Cross-Vault/History"
    - "Base Vault/Runtime"
    - "Base Vault/Tools"
    - "Bootstrap/Tools"

