name: Package IMP-009 base

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/package-imp009-base.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-imp009-base-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install pyyaml
      - name: Build fresh base
        run: python "Base Vault/Tools/v0.8.0-r2/build-base.py" "$RUNNER_TEMP/MDSE_IMP009_BASE_v0.8.19"
      - name: Validate fresh base
        run: python "Base Vault/Testing/check-release.py" --base "$RUNNER_TEMP/MDSE_IMP009_BASE_v0.8.19"
      - name: Upload fresh base including vault dotfiles
        uses: actions/upload-artifact@v4
        with:
          name: MDSE_IMP009_BASE_v0.8.19_complete
          path: ${{ runner.temp }}/MDSE_IMP009_BASE_v0.8.19
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
