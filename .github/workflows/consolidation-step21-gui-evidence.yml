name: Consolidation Step 21 - GUI evidence session preparation (no GUI)

on:
  push:
    branches: [consolidation/step21-gui-evidence-sessions-2026-10-11]
    paths:
      - '.github/workflows/consolidation-step21-gui-evidence.yml'
      - '66_Testing/consolidation/step21_*'
      - '66_Testing/consolidation/test_step21_*'
      - '66_Testing/consolidation/STEP21_*'

permissions:
  contents: read

jobs:
  evidence-preparation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Sparse checkout excludes publicly reachable QEAX ZIP
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/EA_2026_09_06_endgame.qeax.zip
      - name: Confirm no protected model ZIP or user evidence in worktree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e EA_2026_09_06_endgame.qeax.zip
          test -f 66_Testing/consolidation/step21_prepare_session.py
          test -f 66_Testing/consolidation/step21_evidence.py

      - name: Install controlled YAML build dependency
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Verify 29 fail-closed evidence tests (no GUI)
        run: python3 -m unittest discover -s 66_Testing/consolidation -p 'test_step21_evidence.py' -v

      - name: Prepare two Linux-hosted target-platform TEMPLATES only
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          python3 66_Testing/consolidation/step21_prepare_session.py \
            --platform macos --workspace "$RUNNER_TEMP/step21-target-macos" --expected-commit "$commit"
          python3 66_Testing/consolidation/step21_prepare_session.py \
            --platform windows --workspace "$RUNNER_TEMP/step21-target-windows" --expected-commit "$commit"
          python3 66_Testing/consolidation/step21_evidence.py --check \
            "$RUNNER_TEMP/step21-target-macos/PRIVATE_GUI_RESULTS.json" \
            "$RUNNER_TEMP/step21-target-windows/PRIVATE_GUI_RESULTS.json"
          python3 66_Testing/consolidation/step20_validate_fixture.py --vault "$RUNNER_TEMP/step21-target-macos/02_Synthetic_GUI_Vault"
          python3 66_Testing/consolidation/step20_validate_fixture.py --vault "$RUNNER_TEMP/step21-target-windows/02_Synthetic_GUI_Vault"
          STEP20_SYNTHETIC_VAULT="$RUNNER_TEMP/step21-target-macos/02_Synthetic_GUI_Vault" \
            python3 -m unittest discover -s 66_Testing/consolidation -p 'test_step20_synthetic.py' -v
          test ! -e "$RUNNER_TEMP/step21-target-macos/02_Synthetic_GUI_Vault/.git"
          test ! -e "$RUNNER_TEMP/step21-target-windows/02_Synthetic_GUI_Vault/.git"
          echo 'STEP21_PRIVATE_TEMPLATES=2; GUI_CASES_PER_TARGET=16'
          echo 'STEP21_NATIVE_HOST=LINUX; GUI_MAC_EXECUTED=false; GUI_WINDOWS_EXECUTED=false'
          echo 'STEP21_PRIVATE_EVIDENCE_UPLOADED=false'
          echo 'STEP21_RELEASE_OR_ARCHIVE_ALLOWED=false'

      - name: Report only readiness metadata; never upload session vaults or logs
        shell: bash
        run: |
          {
            echo '## Step 21 — controlled GUI test-session preparation only'
            echo '- Two target-platform private result TEMPLATES generated and checked'
            echo '- Both still have 16 cases NOT RUN; no real Obsidian GUI launched'
            echo '- Structural checks and missing-evidence rejection verified'
            echo '- No synthetic vault, private evidence, plugin binaries, or QEAX artifacts uploaded'
            echo '- This Linux-hosted CI cannot claim actual Mac/Windows acceptance'
            echo '- Both main branches unchanged; release/promotion/standalone archival unapproved'
          } >> "$GITHUB_STEP_SUMMARY"
