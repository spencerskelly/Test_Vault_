name: Native SysML v2 pilot fixture gate
on:
  workflow_dispatch:
jobs:
  official-sysml-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: sysml-validation
          python-version: '3.11'
          channels: conda-forge
          channel-priority: strict
      - name: Install official SysML Jupyter kernel in isolated environment
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge 'jupyter-sysml-kernel=0.60.1' 'jupyter_client' 'jupyter_core'
          java -version
          jupyter kernelspec list
          python -c "from jupyter_client import KernelManager; assert 'sysml' in __import__('jupyter_client.kernelspec',fromlist=['KernelSpecManager']).KernelSpecManager().find_kernel_specs()"
      - name: Verify diagnostic classifier regression
        shell: bash -el {0}
        run: python -m unittest -v 15_Testing/test_sysml2_jupyter_diagnostics.py
      - name: Validate positive SysML fixture with real kernel
        shell: bash -el {0}
        run: python 15_Testing/sysml2_jupyter_fixture_gate.py --fixture 29_SysMLv2_Translator_Workbench/Fixtures/synthetic_part_definition_usage.sysml --expect ACCEPTED
      - name: Reject invalid SysML fixture with real kernel
        shell: bash -el {0}
        run: python 15_Testing/sysml2_jupyter_fixture_gate.py --fixture 29_SysMLv2_Translator_Workbench/Fixtures/synthetic_invalid_syntax.sysml --expect REJECTED
# Manual dispatch until actual parser execution and diagnostics are validated.
# A passing workflow is parser evidence, not authorization for native emission.
