name: Stage pinned importer history after Workbench 0.5 verification

on:
  push:
    branches: [integration/importer-persisted-2026-10-09]

permissions:
  contents: write

concurrency:
  group: importer-history-stage-2026-10-09
  cancel-in-progress: false

jobs:
  staged-importer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_BRANCH: integration/importer-persisted-2026-10-09
      BASE_SHA: caafef60781b91712687e86bfdf1ddaebf3b78f0
      WORKBENCH_SHA: 8097f383c41617f879eac8e4ca19fab1d0cb7657
      IMPORTER_SHA: 0494354ec40378e119b17c61fdf6e828844035e4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate exact importer history in runner, do not push yet
        id: importer
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$STAGING_BRANCH"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git merge-base --is-ancestor "$WORKBENCH_SHA" HEAD
          test -z "$(git status --porcelain=v1 -uall)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin refs/heads/importer/baseline-contract-2026-10-05
          test "$(git rev-parse FETCH_HEAD)" = "$IMPORTER_SHA" || {
            echo "::error::Importer branch moved; refusing unreviewed revision"
            exit 1
          }
          if git merge-base --is-ancestor "$IMPORTER_SHA" HEAD; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            previous="$(git rev-parse HEAD)"
            git merge --no-ff --no-edit -m "Integrate approved importer v0.8.19 candidate history on WB-129 0.5 staging" "$IMPORTER_SHA"
            read -r parent1 parent2 < <(git show -s --format='%P' HEAD)
            test "$parent1" = "$previous"
            test "$parent2" = "$IMPORTER_SHA"
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
          git merge-base --is-ancestor "$IMPORTER_SHA" HEAD
          git merge-base --is-ancestor "$WORKBENCH_SHA" HEAD
          test -f 66_Testing/check_importer_workbench_localmodel.py
          test -f Importer/Tools/v0.8.19/EA_to_MDSE_Native_Importer_v0.8.19.html
          test -f 55_Workbench/scripts/real-vault-05-acceptance.ts
          echo "Staging source commit: $(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 55_Workbench/package-lock.json
      - name: Install schema parser
        run: python3 -m pip install pyyaml
      - name: Fail-closed Local Model 0.5 and importer regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 66_Testing/check_importer_workbench_localmodel.py
          python3 Importer/Tools/v0.8.19/sync_source_profile.py --check
          node Importer/Testing/v0.8.19/release_gate_regression_test.js
          python3 Importer/Testing/v0.8.19/imp009_output_acceptance_selftest.py
          python3 "Base Vault/Tools/v0.8.0-r2/build-base.py" "$RUNNER_TEMP/validated-base"
          grep -q 'schemaVersion: "0.5"' "$RUNNER_TEMP/validated-base/99_System/03_Schemas/local-model.yaml"
      - name: Run Workbench 0.5 typecheck tests and production build
        working-directory: 55_Workbench
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build
          git diff --exit-code -- src test package.json package-lock.json
      - name: Push only tested merge commit to isolated staging branch
        if: steps.importer.outputs.already == 'false'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$STAGING_BRANCH"
          git merge-base --is-ancestor "$IMPORTER_SHA" HEAD
          git merge-base --is-ancestor "$WORKBENCH_SHA" HEAD
          remote="$(git ls-remote --heads origin "refs/heads/$STAGING_BRANCH" | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$STAGING_BRANCH"
          echo "Only the isolated integration branch was updated." >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize acceptance scope
        if: success()
        run: |
          echo "Pinned importer/Workbench merge and component gates passed. Full QEAX was separately accepted on identical source heads. Not a controlled release." >> "$GITHUB_STEP_SUMMARY"
