name: P03 legacy compatibility synthetic tests

on:
  push:
    branches: [integration/p03-legacy-compat-tests-20261013]
    paths:
      - '.github/workflows/p03-legacy-compat-tests.yml'
      - '66_Testing/consolidation/test_p03_legacy_compat.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-legacy-triage-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout of the test only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/p03-legacy-compat-tests.yml
            /66_Testing/consolidation/test_p03_legacy_compat.py
      - name: Syntax compilation
        run: python3 -m py_compile 66_Testing/consolidation/test_p03_legacy_compat.py
      - name: Execute committed synthetic tests
        run: python3 -m unittest discover -s 66_Testing/consolidation -p test_p03_legacy_compat.py -v
      - name: Record evidence scope
        shell: bash
        run: |
          echo "## P03 synthetic-only validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact code SHA: `$(git rev-parse HEAD)`" >> "$GITHUB_STEP_SUMMARY"
          echo "No actual importer, production model, QEAX data, or Obsidian GUI exercised." >> "$GITHUB_STEP_SUMMARY"
