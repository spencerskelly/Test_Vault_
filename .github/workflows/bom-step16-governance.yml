name: BOM Step 16 proposal-only schema governance gate

on:
  push:
    branches: [integration/bom-governance-step16-2026-10-09]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 55_Workbench/package-lock.json
      - name: Install governed YAML parser
        run: python3 -m pip install pyyaml
      - name: Prove both proposals and all active 0.5/1.36/1.18 schema boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 66_Testing/check_bom_step16_proposals.py
          python3 66_Testing/check_importer_workbench_localmodel.py
          python3 Importer/Tools/v0.8.19/sync_source_profile.py --check
      - name: Build ephemeral Base and run original release checker
        shell: bash
        run: |
          set -euo pipefail
          python3 "Base Vault/Tools/v0.8.0-r2/build-base.py" "$RUNNER_TEMP/mdse-base"
          python3 "Base Vault/Testing/check-release.py" --base "$RUNNER_TEMP/mdse-base" --workbench "55_Workbench" > "$RUNNER_TEMP/release.log" 2>&1 || {
            grep -E '^FAIL |^WARN |fail,' "$RUNNER_TEMP/release.log" || true
            exit 1
          }
          grep -E '^WARN |fail,' "$RUNNER_TEMP/release.log" || true
      - name: Verify candidate source remains testable
        working-directory: 55_Workbench
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          node --import tsx --test test/bom-localmodel-06.test.ts test/bom-variantof.test.ts test/cache.test.ts
          npm test
          npm run build
      - name: Summarize guarded proposal
        if: success()
        shell: bash
        run: |
          {
            echo "## Step 16 BOM governance proposals: VALIDATED AS PROPOSALS"
            echo "- Active Local Model 0.5, relationships 1.36, element-types 1.18: unchanged"
            echo "- Workbench 0.6 experimental reader, actual writer 0.5: verified"
            echo "- variantOf is not yet an approved YAML relationship"
            echo "- All 31 frozen BOM artifact digests, source/release checks and Workbench tests: PASS"
            echo "- No schema 0.6 writer, release, or main-branch promotion"
          } >> "$GITHUB_STEP_SUMMARY"
