name: WB-106 controlled runtime integration
on:
  push:
    branches: ["wb106-release-integration"]
permissions:
  contents: write
jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python "Base Vault/Tools/v0.8.0-r2/update-plugin-lock.py"
      - run: python "Base Vault/Testing/check-release.py"
      - name: Commit generated lock files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .obsidian/plugin-lock.yaml .obsidian/community-plugins.json
          if git diff --cached --quiet; then
            echo "Generated lock files already current"
            exit 0
          fi
          git commit -m "Regenerate controlled plugin lock for Workbench 0.1.17 [skip ci]"
          git push
