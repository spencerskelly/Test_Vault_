name: Importer candidate

on:
  push:
    branches: [main]
    paths:
      - "Importer/**"
      - "Base Vault/**"
      - "99_System/03_Schemas/**"
      - ".obsidian/plugin-lock.yaml"
      - ".obsidian/community-plugins.json"
      - "00_Workspace/**"
      - ".github/workflows/importer-candidate.yml"
  pull_request:
    branches: [main]
    paths:
      - "Importer/**"
      - "Base Vault/**"
      - "99_System/03_Schemas/**"
      - ".obsidian/plugin-lock.yaml"
      - ".obsidian/community-plugins.json"
      - "00_Workspace/**"
      - ".github/workflows/importer-candidate.yml"
  workflow_dispatch:

concurrency:
  group: importer-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release-check dependency
        run: python -m pip install pyyaml
      - name: Check release authority alignment
        run: python "Base Vault/Testing/check-release.py"
      - name: Check current importer regression contract
        run: node "Importer/Testing/v0.8.14/local_endpoint_evidence_static_test.js"
      - name: Check v0.8.15 fresh-base compatibility
        run: node "Importer/Testing/v0.8.15/fresh_base_compatibility_static_test.js"
      - name: Check v0.8.16 output structure
        run: node "Importer/Testing/v0.8.16/output_structure_static_test.js"
      - name: Check v0.8.17 filesystem resilience
        run: node "Importer/Testing/v0.8.17/filesystem_resilience_static_test.js"
      - name: Check v0.8.18 naming and placement
        run: node "Importer/Testing/v0.8.18/naming_placement_static_test.js"
      - name: Check v0.8.19 headless acceptance harness syntax
        run: node --check "Importer/Testing/v0.8.19/headless_full_import.js"

      - name: Compile generated v0.8.19 headless VM source
        env:
          MDSE_HEADLESS_COMPILE_ONLY: "1"
        run: node "Importer/Testing/v0.8.19/headless_full_import.js" "Importer/Tools/v0.8.19/EA_to_MDSE_Native_Importer_v0.8.19.html" /dev/null "$RUNNER_TEMP/unused"

      - name: Check IMP-005 acceptance harness syntax
        run: node --check "Importer/Testing/v0.8.19/fresh_base_initialization_regression_test.js"

      - name: Build fresh Base for IMP-005
        run: python3 "Base Vault/Tools/v0.8.0-r2/build-base.py" "$RUNNER_TEMP/imp005-fresh-base"

      - name: Check IMP-005 fresh-base initialization runtime
        run: node "Importer/Testing/v0.8.19/fresh_base_initialization_regression_test.js" "$RUNNER_TEMP/imp005-fresh-base"

      - name: Check v0.8.19 aggregate release gate
        run: node "Importer/Testing/v0.8.19/release_gate_regression_test.js"
      - name: Compile IMP-009 output validator
        run: python -m py_compile "Importer/Testing/v0.8.14/imp009_output_acceptance.py" "Importer/Testing/v0.8.14/imp009_output_acceptance_selftest.py"
      - name: Exercise IMP-009 output validator
        run: python "Importer/Testing/v0.8.14/imp009_output_acceptance_selftest.py"

  package-integration-base:
    needs: static-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base-build dependency
        run: python -m pip install pyyaml
      - name: Build fresh IMP-009 integration base
        run: python "Base Vault/Tools/v0.8.0-r2/build-base.py" "$RUNNER_TEMP/MDSE_IMP009_BASE_v0.8.14"
      - name: Validate generated base
        run: python "Base Vault/Testing/check-release.py" --base "$RUNNER_TEMP/MDSE_IMP009_BASE_v0.8.14"
      - name: Upload fresh base
        uses: actions/upload-artifact@v4
        with:
          name: MDSE_IMP009_BASE_v0.8.14
          path: ${{ runner.temp }}/MDSE_IMP009_BASE_v0.8.14
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
