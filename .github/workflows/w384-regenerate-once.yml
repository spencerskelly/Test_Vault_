name: W384 regenerate governed outputs once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/w384-regenerate-once.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python "Base Vault/Tools/v0.8.0-r2/build-plugin-config.py"
      - run: python "Base Vault/Tools/v0.8.0-r2/update-plugin-lock.py"
      - name: Commit exact generated outputs and remove one-shot workflow
        run: |
          rm ".github/workflows/w384-regenerate-once.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "W-384 regenerate governed runtime configuration after Port cleanup"
          git push origin HEAD:${{ github.head_ref }}
