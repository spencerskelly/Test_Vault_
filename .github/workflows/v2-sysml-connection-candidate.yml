name: V2 SysML CAN connection candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Provision pinned parser
        run: bash "25_Testing/Fixtures/Golden Charger v2/provision_parser.sh" "$RUNNER_TEMP/sysml-parser"
      - name: Independently validate isolated connection candidate
        run: |
          cd "$RUNNER_TEMP/sysml-parser/sysmlv2-validator"
          ./validate-sysml "$GITHUB_WORKSPACE/25_Testing/Fixtures/Charger Connections v2/connection_candidate.sysml"
      - name: Test connection endpoint negative controls
        run: |
          cd "$RUNNER_TEMP/sysml-parser/sysmlv2-validator"
          python3 "$GITHUB_WORKSPACE/25_Testing/Fixtures/Charger Connections v2/check_connection_semantics.py" \
            --source "$GITHUB_WORKSPACE/25_Testing/Fixtures/Charger Connections v2/connection_candidate.sysml" \
            --validator "./validate-sysml {model}"
      - name: Upload parser provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-can-connection-candidate-evidence
          path: |
            ${{ runner.temp }}/sysml-parser/parser-provenance.txt
            ${{ runner.temp }}/sysml-parser/parser-sha256.txt
          if-no-files-found: warn
          retention-days: 30
