name: Step115 IMP-011 v2 integration fixtures
on:
  push:
    branches: [integration/p03-legacy-compat-tests-20261013]
    paths:
      - '66_Testing/consolidation/test_imp011_topology_v2_step115.py'
      - '66_Testing/consolidation/imp011_topology_acceptance_v2.py'
      - '.github/workflows/step115-imp011-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v2-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            66_Testing/consolidation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s 66_Testing/consolidation -p 'test_imp011_topology_v2_step115.py' -v
