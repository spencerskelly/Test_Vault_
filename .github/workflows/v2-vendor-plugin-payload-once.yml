name: Vendor legacy plugin payload into V2 (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    if: github.ref == 'refs/heads/feat/v2-integrated-pilot-20261018'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy artifacts and verify hashes
        run: python3 26_Definitions/tools/migrate_v1_plugin_payload_once.py
      - name: Confirm no V2 plugin runtime paths point into archive
        run: |
          test -f "20_Base Vault/Runtime/Plugins/plugin-lock.v2.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path("20_Base Vault/Runtime/Plugins")
          j=json.loads((r/"plugin-lock.v2.json").read_text())
          assert j["status"]=="unverified_v2_runtime"
          assert len(j["plugins"])==7
          for pid in j["plugins"]:
              assert (r/pid/"main.js").is_file()
              assert "100_Archive" not in str(r/pid)
          PY
      - name: Commit only V2 payload files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "20_Base Vault/Runtime/Plugins"
          git commit -m "build(v2): vendor seven verified-blob plugin payloads into V2 ownership"
          git push origin HEAD:feat/v2-integrated-pilot-20261018
