name: V2 migration executable repair
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install note-format dependencies
        run: pip install 'PyYAML==6.0.2'
      - name: Validate golden and sample notes against ADR-V2-06 note format
        run: >
          python3 21_Importer/mdse_note_format.py
          "25_Testing/Fixtures/Golden Charger v2/Controller.md"
          "25_Testing/Fixtures/Golden Charger v2/Power Module.md"
          "25_Testing/Fixtures/Golden Charger v2/Charger.md"
          "20_Base Vault/Public Sample Vault/10_Model/Sample Instrument.md"
      - name: Importer core unit tests (merge, rerun, ZIP)
        run: node --test 25_Testing/test_mdse_core.test.mjs
      - name: Importer core agrees with the Python validator
        run: python3 -m unittest 25_Testing/test_mdse_core_crosscheck.py
      - name: Browser SQLite reader returns exactly what sqlite3 returns
        run: python3 -m unittest 25_Testing/test_qeax_reader.py
      - name: Single-file HTML importer is current
        run: node 21_Importer/build_importer_html.mjs --check
      - name: Install Chromium for the importer browser test
        run: pip install 'playwright==1.56.0' && python3 -m playwright install --with-deps chromium
      - name: Drive the HTML importer in a real browser
        run: python3 -m unittest 25_Testing/test_importer_html_browser.py
      - name: Test note-format validator
        run: python3 -m unittest 25_Testing/test_v2_note_format.py
      - name: Test SharePoint safety preflight
        run: python3 -m unittest 25_Testing/test_check_sharepoint_safety.py
      - name: SharePoint safety of the sample vault
        run: python3 25_Testing/check_sharepoint_safety.py "20_Base Vault"
      - name: Generated mapping matrix is current
        run: python3 26_Definitions/tools/build_v2_mapping_matrix.py --check
      - name: Generated step index is current
        run: python3 26_Definitions/tools/build_v2_step_index.py --check
      - name: No stale workflow or test paths remain
        run: python3 26_Definitions/tools/repair_v2_workflow_paths.py --check
      - name: Verify reference-safe consolidation preflight
        run: python3 -m unittest 25_Testing/test_v2_note_backlink_audit.py
      - name: Verify all Markdown notes are indexed by MOCs
        run: python3 -m unittest 25_Testing/test_repository_note_moc_coverage.py
      - name: Verify approved V2 native-usage and definition decisions
        run: node --test 24_Workbench/registry/runtime/approved-v2-clarifications.test.mjs
      - name: Validate approved vs runtime divergence register
        run: python3 -m unittest 25_Testing/test_v2_approved_runtime_divergences.py
      - name: Validate V1-to-V2 reuse ledger
        run: python3 -m unittest 25_Testing/test_v1_to_v2_reuse_ledger.py
      - name: Validate V1 archive MOC completeness
        run: python3 -m unittest 25_Testing/test_v1_archive_moc_coverage.py
      - name: Validate master MOC navigation and coverage
        run: python3 -m unittest 25_Testing/test_v2_master_moc.py
      - name: Validate executable candidate crosswalk
        run: python3 -m unittest 25_Testing/test_v2_executable_candidate_crosswalk.py
      - name: Verify approved Phase 8 private golden gate and rollback
        run: python3 -m unittest 25_Testing/test_run_gated_v2_approved_phase8.py
      - name: Verify approved Phase 8 and Phase 9 integration
        run: python3 -m unittest 25_Testing/test_v2_approved_phase8_phase9_integration.py
      - name: Verify diagram-free read-only QEAX approved-family projection
        run: python3 -m unittest 25_Testing/test_v2_approved_qeax_mapping.py
      - name: Verify exact approved 60-element and 26-connector family resolver
        run: python3 -m unittest 25_Testing/test_v2_approved_family_resolver.py
      - name: Validate recovered mapping families
        run: python3 -m unittest 25_Testing/test_v2_mapping_family_recovery.py
      - name: Validate recovery inventory
        run: python3 -m unittest 25_Testing/test_v2_recovery_traceability.py
      - name: Validate V2 connector evidence syntax
        run: python3 -m unittest 25_Testing/test_v2_validate_connector_evidence.py
      - name: Test EA connector-end evidence extraction
        run: python3 -m unittest 25_Testing/test_v2_connector_end_evidence.py
      - name: Test typed V2 relationship evidence gates
        run: python3 -m unittest 25_Testing/test_v2_typed_relationship_gates.py
      - name: Test V2 source endpoint types
        run: python3 -m unittest 25_Testing/test_v2_source_endpoint_types.py
      - name: Test V2 relationship candidate projection
        run: python3 -m unittest 25_Testing/test_v2_relationship_candidate_projection.py
      - name: Test approved V2 element candidate projection
        run: python3 -m unittest 25_Testing/test_v2_element_candidate_projection.py
      - name: Test bounded V2 QEAX slice relationship review
        run: python3 -m unittest 25_Testing/test_v2_qeax_slice_review.py
      - name: Enforce EA diagram exclusion across active V2 executables
        run: python3 -m unittest 25_Testing/test_v2_ea_diagram_scope.py
      - name: Test V2 QEAX read-only source preflight
        run: python3 -m unittest 25_Testing/test_v2_qeax_preflight.py
      - name: Test standalone V2 base generation
        run: python3 -m unittest 25_Testing/test_v2_test_base_builder.py
      - name: Verify V1 archive and V2 relocation manifest completeness
        run: python3 26_Definitions/tools/check_v2_migration_manifest.py
      - name: Confirm repair is idempotent and no stale executable references remain
        run: python3 26_Definitions/tools/repair_v2_moved_registry_paths.py --check
      - name: Audit active V2 references without rewriting historical documentation
        run: python3 26_Definitions/tools/audit_v2_legacy_references.py --strict > "$RUNNER_TEMP/v2-reference-audit.json"
      - name: Publish migration reference audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-active-reference-audit
          path: ${{ runner.temp }}/v2-reference-audit.json
          if-no-files-found: warn
      - name: Reject V2 runtime dependencies on V1 archive
        run: python3 26_Definitions/tools/check_v2_archive_runtime_boundary.py
      - name: Verify unchanged governance registry hashes
        run: python3 25_Testing/verify_sysml_v2_registry_pins.py "$PWD"
      - name: Verify pinned v2 source registry
        run: node 24_Workbench/registry/runtime/v2-translator-preflight.mjs "$PWD"
      - name: Execute synthetic V2 registry tests
        run: node --test 24_Workbench/registry/runtime/pinned-v2-eligibility.test.mjs
      - name: Execute Phase 9 bridge tests
        run: python3 -m unittest 25_Testing/test_phase9_source_direction_bridge.py
