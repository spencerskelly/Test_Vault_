name: V2 migration executable repair
on:
  push:
    branches: [chore/v2-folder-separation-20261018]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm repair is idempotent and no stale executable references remain
        run: python3 26_Definitions/tools/repair_v2_moved_registry_paths.py --check
      - name: Verify pinned v2 source registry
        run: node 24_Workbench/registry/runtime/v2-translator-preflight.mjs "$PWD"
      - name: Execute synthetic V2 registry tests
        run: node --test 24_Workbench/registry/runtime/pinned-v2-eligibility.test.mjs
      - name: Execute Phase 9 bridge tests
        run: python3 -m unittest 25_Testing/test_phase9_source_direction_bridge.py
