name: Bootstrap candidate

on:
  push:
    branches: [main]
    paths:
      - "Bootstrap/Tools/v0.3.1/**"
      - ".github/workflows/bootstrap-candidate.yml"
  pull_request:
    branches: [main]
    paths:
      - "Bootstrap/Tools/v0.3.1/**"
      - ".github/workflows/bootstrap-candidate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bootstrap/Tools/v0.3.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Bootstrap/Tools/v0.3.1/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Record artifact hashes
        run: sha256sum main.js manifest.json styles.css > artifact-sha256.txt
      - name: Verify build is reproducible
        run: |
          cp main.js /tmp/bootstrap-main.js
          npm run build
          cmp -s main.js /tmp/bootstrap-main.js
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdse-bootstrap-0.3.1
          path: |
            Bootstrap/Tools/v0.3.1/main.js
            Bootstrap/Tools/v0.3.1/manifest.json
            Bootstrap/Tools/v0.3.1/styles.css
            Bootstrap/Tools/v0.3.1/artifact-sha256.txt
          if-no-files-found: error
      - name: Sync checked-in candidate artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifact
          cp main.js artifact/main.js
          cp manifest.json artifact/manifest.json
          cp styles.css artifact/styles.css
          cp artifact-sha256.txt artifact/artifact-sha256.txt
      - name: Commit candidate artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifact/main.js artifact/manifest.json artifact/styles.css artifact/artifact-sha256.txt
          if git diff --cached --quiet; then
            echo "Bootstrap candidate artifact already current."
            exit 0
          fi
          git commit -m "Build Bootstrap 0.3.1 candidate artifact"
          git push
