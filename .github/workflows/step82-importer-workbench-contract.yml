name: Step82 importer Workbench source compatibility

on:
  pull_request:
    branches: [consolidation/step22-single-repo-cutover-2026-10-11]
    paths:
      - '.github/workflows/step82-importer-workbench-contract.yml'
      - '66_Testing/check_importer_workbench_localmodel.py'
      - '55_Workbench/src/core/localmodel.ts'
      - '99_System/03_Schemas/local-model.yaml'
      - 'Base Vault/Definition/mdse-release.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importer-workbench-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /66_Testing/check_importer_workbench_localmodel.py
            /55_Workbench/src/core/localmodel.ts
            /99_System/03_Schemas/local-model.yaml
            /Base Vault/Definition/mdse-release.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.2
      - name: Block incompatible importer and Workbench Local Model source
        run: python3 66_Testing/check_importer_workbench_localmodel.py
      - name: Prove incompatible schema fails closed in disposable copy
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          mkdir -p "$test_dir/66_Testing" "$test_dir/55_Workbench/src/core" "$test_dir/99_System/03_Schemas" "$test_dir/Base Vault/Definition"
          cp 66_Testing/check_importer_workbench_localmodel.py "$test_dir/66_Testing/"
          cp 55_Workbench/src/core/localmodel.ts "$test_dir/55_Workbench/src/core/"
          cp 99_System/03_Schemas/local-model.yaml "$test_dir/99_System/03_Schemas/"
          cp "Base Vault/Definition/mdse-release.yaml" "$test_dir/Base Vault/Definition/"
          python3 - "$test_dir/99_System/03_Schemas/local-model.yaml" <<'PY'
          import pathlib, sys, yaml
          path = pathlib.Path(sys.argv[1])
          schema = yaml.safe_load(path.read_text())
          schema["schemaVersion"] = "0.7"
          schema["compatibility"]["writableVersion"] = "0.7"
          path.write_text(yaml.safe_dump(schema))
          PY
          set +e
          python3 "$test_dir/66_Testing/check_importer_workbench_localmodel.py" > "$test_dir/failure.log" 2>&1
          status=$?
          set -e
          cat "$test_dir/failure.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::Incompatible schema incorrectly passed"
            exit 1
          fi
          grep -q "BLOCKED:" "$test_dir/failure.log"
          echo "Negative compatibility test: PASS (schema 0.7 rejected)"
      - name: Record source-only validation boundary
        if: always()
        run: |
          echo 'Importer to Workbench parser/writer compatibility gate. No model archive, QEAX conversion, release approval or plugin publication.' >> "$GITHUB_STEP_SUMMARY"
