name: MDSE consolidated read-only integration gate

# Candidate integration check only. Not a release, GUI test or historical CI replacement.
on:
  push:
    branches: [integration/p03-legacy-compat-tests-20261013]
    paths:
      - '.github/workflows/mdse-integration-readonly.yml'
      - '55_Workbench/src/**'
      - '55_Workbench/test/**'
      - '55_Workbench/package*.json'
      - '66_Testing/consolidation/test_p03_legacy_compat.py'
      - '66_Testing/consolidation/test_step22_retirement.py'
      - '66_Testing/consolidation/test_step19_generated_base.py'
      - '66_Testing/consolidation/test_step20_synthetic_model.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mdse-integration-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlled-python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /66_Testing/consolidation/
            /55_Workbench/package.json
            /55_Workbench/manifest.json
            /Base Vault/Definition/
      - name: Synthetic legacy classifier checks
        run: python3 -m unittest discover -s 66_Testing/consolidation -p 'test_p03_legacy_compat.py' -v
      - name: Record restricted validation scope
        run: |
          echo 'Read-only synthetic checks; no QEAX, model ZIP, Obsidian GUI, release promotion or artifact publishing.' >> "$GITHUB_STEP_SUMMARY"






  governance-provenance-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Read-only source checkout without archived QEAX
        uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/EA_2026_09_06_endgame.qeax.zip
      - name: Install pinned YAML dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Step14 document byte and approval-marker regressions
        run: python3 -m unittest discover -s 66_Testing/consolidation -p 'test_step14_docs.py' -v
      - name: Step15 governance stop-gate regressions
        run: python3 -m unittest discover -s 66_Testing/consolidation -p 'test_step15_governance.py' -v
      - name: Step16 release provenance regressions
        run: python3 -m unittest discover -s 66_Testing/consolidation -p 'test_step16_release_provenance.py' -v
      - name: Step16 fail-closed native release diagnostic
        run: python3 66_Testing/consolidation/step16_native_gate.py
      - name: Step17 document registry review and negative tests
        run: |
          python3 66_Testing/consolidation/step17_registry_review.py
          python3 -m unittest discover -s 66_Testing/consolidation -p 'test_step17_registry.py' -v
      - name: Preserve proposal-only scope
        run: echo 'Historical governance/provenance verification only; no W decision or release approval implied.' >> "$GITHUB_STEP_SUMMARY"

  historical-authority-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout historical evidence without original QEAX bytes
        uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/EA_2026_09_06_endgame.qeax.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retired workflow archive SHA regression
        run: node --test 66_Testing/consolidation/test_step11_retirement.cjs
      - name: Workbench authority detector regression
        run: node --test 66_Testing/consolidation/test_workbench_authority.cjs
      - name: Reference policy negative regression
        run: python3 -m unittest discover -s 66_Testing/consolidation -p 'test_workbench_reference_policy.py' -v
      - name: Historical registry proposal regression
        run: python3 -m unittest discover -s 66_Testing/consolidation -p 'test_step13_registry.py' -v
      - name: Preserve historical scope
        run: echo 'Historical test behavior only; branch-specific historical preflight count assertions are not reinterpreted as current release approval.' >> "$GITHUB_STEP_SUMMARY"

  importer-static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source contracts without archived QEAX
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/EA_2026_09_06_endgame.qeax.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML validator dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Importer v0.8.14 through v0.8.18 regression contract
        run: |
          node Importer/Testing/v0.8.14/local_endpoint_evidence_static_test.js
          node Importer/Testing/v0.8.15/fresh_base_compatibility_static_test.js
          node Importer/Testing/v0.8.16/output_structure_static_test.js
          node Importer/Testing/v0.8.17/filesystem_resilience_static_test.js
          node Importer/Testing/v0.8.18/naming_placement_static_test.js
      - name: Source profile and v0.8.19 headless compile-only
        run: |
          python3 Importer/Tools/v0.8.19/sync_source_profile.py --check
          node --check Importer/Testing/v0.8.19/headless_full_import.js
          MDSE_HEADLESS_COMPILE_ONLY=1 node Importer/Testing/v0.8.19/headless_full_import.js Importer/Tools/v0.8.19/EA_to_MDSE_Native_Importer_v0.8.19.html /dev/null "$RUNNER_TEMP/unused"
          node --check Importer/Testing/v0.8.19/fresh_base_initialization_regression_test.js
          node Importer/Testing/v0.8.19/release_gate_regression_test.js
      - name: IMP-005 fresh-base initialization regression
        run: |
          python3 'Base Vault/Tools/v0.8.0-r2/build-base.py' "$RUNNER_TEMP/imp005-fresh-base"
          node Importer/Testing/v0.8.19/fresh_base_initialization_regression_test.js "$RUNNER_TEMP/imp005-fresh-base"
      - name: IMP-009 through IMP-011 validators
        run: |
          python3 -m py_compile Importer/Testing/v0.8.19/imp009_output_acceptance.py Importer/Testing/v0.8.19/imp009_output_acceptance_selftest.py
          python3 Importer/Testing/v0.8.19/imp009_output_acceptance_selftest.py
          python3 -m py_compile Importer/Testing/v0.8.19/imp010_hierarchy_acceptance.py Importer/Testing/v0.8.19/imp010_hierarchy_acceptance_selftest.py Importer/Testing/v0.8.19/imp010_interface_flow_acceptance.py Importer/Testing/v0.8.19/imp011_binding_review_acceptance.py Importer/Testing/v0.8.19/imp011_canonical_equals_acceptance.py
          python3 Importer/Testing/v0.8.19/imp010_hierarchy_acceptance_selftest.py
      - name: Report limited scope
        run: echo 'Static importer validation only. No real QEAX or Obsidian GUI; no release or packaged artifact upload.' >> "$GITHUB_STEP_SUMMARY"

  base-and-document-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sparse checkout of controlled base tools and governance tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/EA_2026_09_06_endgame.qeax.zip
      - name: Confirm no source model ZIP in worktree
        run: test ! -e EA_2026_09_06_endgame.qeax.zip
      - name: Install pinned YAML checker
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Review governance regressions
        run: python3 -m unittest discover -s 66_Testing/consolidation -p 'test_step18_registry.py' -v
      - name: Disposable generated Base Vault integrity
        shell: bash
        run: |
          set -euo pipefail
          tempbase="$(mktemp -d "$RUNNER_TEMP/mdse-base-XXXXXX")"
          python3 'Base Vault/Tools/v0.8.0-r2/build-base.py' "$tempbase/base"
          python3 'Base Vault/Testing/check-release.py' --workbench 55_Workbench --base "$tempbase/base"
          python3 66_Testing/consolidation/step19_generated_base.py --base "$tempbase/base"
          STEP19_BASE_DIR="$tempbase/base" python3 -m unittest discover -s 66_Testing/consolidation -p 'test_step19_generated_base.py' -v
          python3 66_Testing/consolidation/step19_generated_base.py --base "$tempbase/base"
      - name: Report scope
        run: echo 'Disposable Base and registry review only. No source-model archive, Obsidian GUI, promotion, or artifact upload.' >> "$GITHUB_STEP_SUMMARY"

  importer-and-governance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout of synthetic validators and consolidation evidence
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Importer/Testing/v0.8.19/
            /66_Testing/consolidation/
            /Base Vault/Definition/
            /55_Workbench/manifest.json
            /55_Workbench/docs/
            /00_Workspace/
            /.obsidian/plugin-lock.yaml
      - name: Exclude source-model archive
        run: test ! -e EA_2026_09_06_endgame.qeax.zip
      - name: Synthetic importer output validator regression
        run: python3 Importer/Testing/v0.8.19/imp009_output_acceptance_selftest.py
      - name: Historical Workbench inventory and archival holds
        run: python3 -m unittest discover -s 66_Testing/consolidation -p 'test_step22_retirement.py' -v
      - name: Record deliberately limited evidence
        run: |
          echo 'Synthetic importer and Step22 governance smoke only; no model archive, real QEAX, generated Base Vault, release, or Obsidian GUI tested.' >> "$GITHUB_STEP_SUMMARY"

  workbench-source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 55_Workbench
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /55_Workbench/src/
            /55_Workbench/test/
            /55_Workbench/bench/
            /55_Workbench/scripts/
            /55_Workbench/package.json
            /55_Workbench/package-lock.json
            /55_Workbench/tsconfig.json
            /55_Workbench/esbuild.config.mjs
            /55_Workbench/manifest.json
            /55_Workbench/styles.css
            /55_Workbench/main.js
            /55_Workbench/artifact-sha256.txt
      - name: Enforce no historical vault or QEAX checkout
        run: |
          test ! -d vault
          test ! -e ../EA_2026_09_06_endgame.qeax.zip
          test -f src/main.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 55_Workbench/package-lock.json
      - name: Test and build (no publication)
        run: |
          npm ci
          npm test
          npm run build
      - name: Verify candidate schema and governed baseline separation
        run: |
          python3 - <<'PY'
          import json, pathlib, re, hashlib, subprocess
          source = pathlib.Path('src/core/localmodel.ts').read_text()
          assert re.search(r'WRITABLE_VERSION\s*=\s*"0\.5"', source), 'writer must stay at 0.5'
          assert '"0.6"' in source and '"0.5"' in source, 'expected read versions missing'
          package = json.loads(pathlib.Path('package.json').read_text())
          manifest = json.loads(pathlib.Path('manifest.json').read_text())
          assert package['version'] == manifest['version'], 'plugin version mismatch'
          baseline = subprocess.check_output(['git', 'show', 'HEAD:55_Workbench/artifact-sha256.txt']).decode()
          expected = next(line.split()[0] for line in baseline.splitlines() if line.endswith('  main.js'))
          governed = subprocess.check_output(['git', 'show', 'HEAD:55_Workbench/main.js'])
          assert hashlib.sha256(governed).hexdigest() == expected, 'governed artifact tampered'
          candidate = pathlib.Path('main.js').read_bytes()
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Workbench 0.5 source candidate (not released)\n')
              out.write('Commit: ' + subprocess.check_output(['git','rev-parse','HEAD']).decode().strip() + '\n')
              out.write('Plugin version: ' + package['version'] + '; writer: 0.5; reader includes 0.6\n')
              out.write('Candidate SHA-256: ' + hashlib.sha256(candidate).hexdigest() + '\n')
              out.write('Controlled SHA-256: ' + expected + '\n')
              out.write('No governed binary replacement or artifact publication.\n')
          PY
      - name: Report build identity
        run: |
          test -f main.js
          sha256sum main.js manifest.json styles.css
          echo 'Workbench source build succeeded; no controlled artifact or release manifest was written to Git.' >> "$GITHUB_STEP_SUMMARY"
