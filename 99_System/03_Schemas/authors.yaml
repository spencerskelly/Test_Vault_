# Author registry for uid generation.
# code: 13 characters, lowercase letters and hyphens. Rule: last name + first name, letters only, truncated to 13, padded with hyphens on the right (Workspace Decision Log W-10).
# ea_names: every spelling of this person found in the EA source Author fields (login names and display names).
# Used by the translator to turn an EA author into the author code at the end of a uid.
schemaVersion: '1.0'
authors:
  - {code: skellyspencer, name: Spencer Skelly,  ea_names: [SpencerSkelly, skellys]}
  - {code: legaspichesca, name: Chesca Legaspi,  ea_names: [legaspic, ChescaLegaspi]}
  - {code: koerferfloria, name: Florian Koerfer, ea_names: [Florian Koerfer, koerfefl]}
  - {code: montanoherman, name: Herman Montano,  ea_names: [HermanMontano, montanoh]}
  - {code: kirchnersilke, name: Silke Kirchner,  ea_names: [kirchnes]}
  - {code: follmannkarin, name: Karin Follmann,  ea_names: [follmank]}
  - {code: nishiokagavin, name: Gavin Nishioka,  ea_names: [nishiokag]}
  - {code: riverajesse--, name: Jesse Rivera,    ea_names: [JesseRivera]}
  - {code: virziray-----, name: Ray Virzi,       ea_names: [rvirzi]}
  - {code: brassbenjamin, name: Benjamin Brass,  ea_names: [brassb]}
# EA authors with no matching person: 722 elements with a blank Author, and one element whose Author is "7.1.0-2".
# Code to use for these: not yet decided.
unmapped: {code: null, ea_names: ['', '7.1.0-2']}
