schemaVersion: '1.0'
fields:
  vault_uid: permanent vault identity
  name: current display name
  access_class: open | assigned | restricted
  repository: optional current repository locator for authorized tooling
  role: company | engineering-common | product-line | domain | project | other
rules:
  - Registry metadata never grants access.
  - Repository permissions are authoritative.
  - Do not expose restricted vault metadata to unauthorized users.
  - Resolver indexes only locally accessible/authorized vaults.
