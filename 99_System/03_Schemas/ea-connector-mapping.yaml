# EA connector rules, decided by connector type (W-152). One entry per Connector_Type.
# Counts are from the export t_connector.csv (21,822 connectors). Endpoint types are
# the MDSE types after the element mapping (ea-element-mapping.yaml), not EA types.
# Rules are added type by type as Spencer approves them. Types not listed are not decided.
# Connector Name line, every type (W-158): "- Connector name: <name> (to [[other end]])" in the Source: EA section,
# on both end notes for Connector and InformationFlow, on the owner-side note for the other types (W-55, W-56).
schemaVersion: '1.0'
date: '2026-09-29'
connectorTypes:
- eaConnectorType: Generalization
  connectors: 3974
  decision: W-152
  matrixRule: 'Rule 1 (r12 matrix), Rule 71 for the exception'
  source: 'specific element (source), all drawn Source -> Destination, no stereotype, no Notes'
  forward: subtypeOf
  inverse: supertypeOf
  writtenOn: 'subtypeOf on the source note; supertypeOf generated on the destination note; both are lists (W-126)'
  counts:
    resolved: 3973
    uniqueLinks: 3967
    duplicatePairsWrittenOnce: 6
    exception: 1
    sourceNotesWithSeveralParents: 401
  exception: 'connector {DCD0BC02-C22E-4fe2-91FD-01EC342FFECC}, both ends at object 0, writes no link, recorded in the ledger (Rule 71, W-57)'
  name: 'the 2 named connectors (AC, DC) are written on the source note as "- Connector name: <name> (to [[<target>]])" in the source section (W-56, W-158)'
  guid: 'no GUID line; the ledger keys every connector by GUID (W-35, W-57)'
  mixedTypes:
    connectors: 88
    uniqueLinks: 87
    sourceNotes: 81
    reviewLine: 'REVIEW subtypeOf: the two notes have different types'
    where: 'Source: EA section of the source note'
    task: 'Post-Import Task 7, item 6'
- eaConnectorType: Nesting
  connectors: 836
  decision: W-151
  amendedBy: W-152
  note: 'No connector note or link of its own. 584 repeat a ParentID link and write nothing. The 252 independent ones are written as hasChild on the end note (parent) and childOf on the start note (child), or hasPart/partOf when both notes are Objects (W-149).'
  counts:
    repeatParentId: 584
    independent: 252
    childHasNoParentId: 200
    childHasOtherParentId: 52
  reviewLine: 'REVIEW nesting direction: connector {GUID}'
  where: 'Source: EA section of the parent note; wording provisional'
  task: 'Post-Import Task 7, item 5'
- eaConnectorType: Connector
  connectors: 823
  decision: W-153
  status: settled
  matrixRule: 'Rule 41 (no stereotype, 574), Rule 40 (BindingConnector, 249), Rule 71 (1 exception)'
  direction: 'Unspecified on all 823; both fields are symmetric and written on both end notes'
  rules:
  - stereotype: none
    connectors: 574
    field: interfaces
    note: 'symmetric; new field (W-153)'
  - stereotype: BindingConnector
    connectors: 249
    field: equals
    note: 'symmetric and temporary (W-153). Kept for stage 1 to stay mechanical; Post-Import Task 8 turns each into a directional exposes/exposedBy pair (185 have a derivable inner and outer end, 64 need a decision).'
  exception: 'the plain connector with both ends missing from the export writes nothing and is recorded in the ledger (Rule 71, W-57)'
  duplicates:
    decision: W-154
    rule: 'connectors that end on the same pair of notes after the Port merge (either direction) are one link per field; every distinct non-empty Name is kept as its own line, identical names once, unnamed add nothing; every connector GUID stays in the ledger'
    counts: '22 groups hold 70 connectors (16 plain, 6 binding), so 822 resolved connectors become 774 links; 2 groups have different names; 2 groups repeat the same drawing'
  blockLevelEnds:
    decision: W-155
    rule: 'a connector with an end that is not a Port is written as drawn and gets the line "- REVIEW port needed: Connector <name or unnamed> to [[other end]]: connector {GUID}" (W-55, W-157) in the Source: EA section of both end notes; the evidence is in Review - Block-Level Flow Connectors.csv (W-156, W-157)'
    counts: '109 connectors (94 with no Port end, 15 with one); 108 resolve, 1 has both ends missing; 101 distinct flag entries'
  partEnds:
    decision: W-155
    rule: 'a Part end resolves to the block note that types the Part (PDATA1, a Class): 182 ends; the 3 Parts with no block resolve to the Object note with subtype part (W-138); no self-loops'
  context:
    decision: W-155
    rule: 'no assembly or Part context line is written (changes W-114); where a connection was drawn stays in the diagram canvases (W-73)'
  review:
    decision: W-156
    rule: 'every REVIEW line must be resolvable from the vault alone; the note line carries a fixed phrase, a short reason and the GUID; the evidence (ends as drawn with owner and assembly, resolved notes, candidate Ports, derived direction) is in a review table in 99_System/11_Import, regenerated each run'
    equalsDerived: '245 of 249 get a derived outer and inner Port as evidence (185 one level, 60 multi-level, not spot-checked); 4 have none'
  linkCount: '822 resolved connectors become 766 links after Parts resolve to blocks (W-154 counted 774 before that)'
  name:
    decision: W-158
    rule: '"- Connector name: <name> (to [[other end]])" on both end notes, one line per distinct name; unnamed write nothing (174 named, 165 distinct names)'
- eaConnectorType: Aggregation
  connectors: 2288
  decision: W-159
  status: settled
  matrixRule: 'Rules 2, 3, 4 and 51 (r12 matrix); Rule 3 parent/child and Rule 4 participants have no field and are replaced'
  direction: 'all Source -> Destination: source is the part, destination the whole; the forward field is written on the whole'
  rules:
  - aggregation: composite (DestIsAggregate 2, 1688)
    pair: Object to Object
    field: hasPart
  - aggregation: composite (DestIsAggregate 2)
    pair: any other
    field: hasChild
  - aggregation: shared (DestIsAggregate 1, 600)
    pair: any
    field: hasChild
    note: 'grouped under, no ownership; regions of countries 278, Physical Context 57, about 30 real shared parts; Post-Import Task 7'
  precedence: 'an existing link on the pair (folded Part hasPart, W-136, or ParentID placement, W-149) wins and the connector writes nothing: 1,837 connectors (composite 1,551, shared 286)'
  counts: '451 connectors add 450 new links: hasPart 77, hasChild 373; no self-loops, no pair drawn both ways, no pair with both composite and shared'
  mixedTypes:
    reviewLine: 'REVIEW hasChild: the two notes have different types'
    where: 'Source: EA section of the whole'
    counts: '23 links on 15 notes'
  fields: 'SourceCard is the quantity line on the assembly (W-43, W-54; 52); SourceRole archived (W-56); Name uses the W-158 line on the whole (4); DestIsAggregate chooses the rule and stays in the export'
- eaConnectorType: Realisation
  connectors: 950
  decision: W-160
  status: settled
  matrixRule: 'Rules 18, 19, 48, 55 (r12 matrix)'
  direction: 'all Source -> Destination; none named; no self-loops'
  principle: 'a Function or a Design satisfies a requirement; an Object is what a requirement applies to (W-160)'
  rules:
  - pair: Object to Requirement
    connectors: 910
    field: appliesTo
    writtenOn: 'the requirement, pointing at the Object; applies generated on the Object; 909 unique links'
  - pair: Function to Use Case
    connectors: 0
    field: realizedBy
    writtenOn: 'the Use Case; realizes generated on the Function'
  - pair: any other
    connectors: 40
    field: realizedBy
    writtenOn: 'the target; realizes generated on the source'
    reviewLine: 'REVIEW modelCheck: realization <source type> to <target type>'
    note: '40 links on 34 notes; Requirement to Object 8 are drawn the other way and stay here'
  packageEnds: '7 connectors from 6 packages with no note (W-147) write no field; the requirement gets REVIEW modelCheck: realization from folder <vault folder path>'
- eaConnectorType: NoteLink
  connectors: 349
  decision: W-161
  status: settled
  matrixRule: 'Rule 45 (r12 matrix), replaced'
  rules:
  - case: note linked to one element
    notes: 250
    result: 'the note text is written into the element body; no Info note (amends W-145); 177 elements, up to 16 notes on one; 1 empty writes nothing'
  - case: note linked to several elements
    notes: 38
    result: 'Info note (W-145) with describes to each element, describedBy generated; 94 links; field always on the note'
  - case: note to note
    connectors: 2
    result: 'describes in the drawn direction between the two Info notes (my reading)'
  bodyFormat: 'after the comment texts, before the user section: label **EA notes:** then one bullet per note in EA creation order, "- <yyyy-MM-dd>, <author>: <text>" (W-162, Definitions/Note Layout.md item 5)'
  notDecided:
  - 'the canvas text card for the 225 folded notes drawn on diagrams (W-73)'
- eaConnectorType: Dependency
  connectors: 6762
  status: partial
  note: 'decided one stereotype at a time: satisfy 2444, deriveReqt 1416, refine 1114, trace 770, none 667, verify 333, RecoveryRequirement 14, ASILDecompose 4'
  stereotypes:
  - stereotype: satisfy
    connectors: 2444
    decision: W-163
    matrixRule: 'Rules 15, 16, 17, 54, 71'
    rules:
    - pair: Function or Design to Requirement
      connectors: 2328
      field: satisfies
      writtenOn: 'the Function or Design; satisfiedBy generated on the requirement'
    - pair: any other
      connectors: 112
      field: satisfies
      writtenOn: 'the source, in the drawn direction'
      reviewLine: 'REVIEW modelCheck: satisfy <source type> to <target type>'
      note: '112 links on 89 target notes; State to Requirement 92'
    exception: '4 connectors with an end missing from the export write nothing (Rule 71)'
  - stereotype: deriveReqt
    connectors: 1416
    decision: W-164
    matrixRule: 'Rules 23, 57'
    rules:
    - pair: Requirement to Requirement
      connectors: 1410
      field: derivedFrom
      writtenOn: 'the source (derived requirement); derivedBy generated on the target; 1,408 links'
    - pair: any other
      connectors: 6
      field: derivedFrom
      writtenOn: 'the source, in the drawn direction'
      reviewLine: 'REVIEW modelCheck: deriveReqt <source type> to <target type>'
