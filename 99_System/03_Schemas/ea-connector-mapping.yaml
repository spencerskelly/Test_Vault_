# EA connector rules, decided by connector type (W-152). One entry per Connector_Type.
# Counts are from the export t_connector.csv (21,822 connectors). Endpoint types are
# the MDSE types after the element mapping (ea-element-mapping.yaml), not EA types.
# Rules are added type by type as Spencer approves them. Types not listed are not decided.
# Connector Name line, every type (W-158): "- Connector name: <name> (to [[other end]])" in the Source: EA section,
# on both end notes for Connector and InformationFlow, on the owner-side note for the other types (W-55, W-56).
schemaVersion: '1.1'
date: '2026-10-05'
connectorTypes:
- eaConnectorType: Generalization
  connectors: 3974
  decision: W-152
  status: settled
  matrixRule: 'Rule 1 (r12 matrix), Rule 71 for the exception'
  source: 'specific element (source), all drawn Source -> Destination, no stereotype, no Notes'
  forward: subtypeOf
  inverse: supertypeOf
  writtenOn: 'subtypeOf on the source note; supertypeOf generated on the destination note; both are lists (W-126)'
  counts:
    resolved: 3973
    uniqueLinks: 3967
    duplicatePairsWrittenOnce: 6
    exception: 1
    sourceNotesWithSeveralParents: 401
  exception: 'connector {DCD0BC02-C22E-4fe2-91FD-01EC342FFECC}, both ends at object 0, writes no link, recorded in the ledger (Rule 71, W-57)'
  name: 'the 2 named connectors (AC, DC) are written on the source note as "- Connector name: <name> (to [[<target>]])" in the source section (W-56, W-158)'
  guid: 'no GUID line; the ledger keys every connector by GUID (W-35, W-57)'
  mixedTypes:
    connectors: 88
    uniqueLinks: 87
    sourceNotes: 81
    reviewLine: 'REVIEW subtypeOf: the two notes have different types'
    where: 'Source: EA section of the source note'
    task: 'Post-Import Task 7, item 6'
- eaConnectorType: Nesting
  connectors: 836
  decision: W-151
  amendedBy: W-152
  status: settled
  note: 'No connector note or link of its own. 584 repeat a ParentID link and write nothing. The 252 independent ones are written as hasChild on the end note (parent) and childOf on the start note (child), or hasPart/partOf when both notes are Objects (W-149), or hasState/stateOf when an Object owns a State or State Machine or a State Machine owns a State (W-292).'
  counts:
    repeatParentId: 584
    independent: 252
    childHasNoParentId: 200
    childHasOtherParentId: 52
  reviewLine: 'REVIEW nesting direction: connector {GUID}'
  where: 'Source: EA section of the parent note; wording provisional'
  task: 'Post-Import Task 7, item 5'
- eaConnectorType: Connector
  connectors: 823
  decision: W-384
  status: settled
  direction: 'Source drawing direction is preserved as source evidence; Local Model connection endpoints are occurrence references.'
  rules:
  - stereotype: none
    result: 'When both ends resolve to Local Model Interface occurrences in one context, emit one Local Model Connection with endpointA and endpointB. Do not emit note-level interfaces relationships.'
  - stereotype: BindingConnector
    result: 'Resolve as Connection.exposes -> boundary Interface only when the owning context, one boundary Interface, one internal Interface and exactly one internal Connection are deterministic. Otherwise retain temporary local equals/review evidence.'
  exception: 'A connector whose source endpoints cannot be resolved remains source/review evidence; Stage 1 does not manufacture Ports or topology to make it fit.'
  note: 'W-384 supersedes the current-writing Port-note interfaces/equals representation. Local Model 0.3 historical endpoint-owned exposure remains readable only under its original schema version.'
- eaConnectorType: Aggregation
  connectors: 2288
  decision: W-159
  status: settled
  matrixRule: 'Rules 2, 3, 4 and 51 (r12 matrix); Rule 3 parent/child and Rule 4 participants have no field and are replaced'
  direction: 'all Source -> Destination: source is the part, destination the whole; the forward field is written on the whole'
  rules:
  - aggregation: composite (DestIsAggregate 2, 1688)
    pair: Object to Object
    field: hasPart
  - aggregation: composite (DestIsAggregate 2)
    pair: Object owns State or State Machine; State Machine owns State (W-292)
    field: hasState
  - aggregation: composite (DestIsAggregate 2)
    pair: any other
    field: hasChild
  - aggregation: shared (DestIsAggregate 1, 600)
    pair: any
    field: includes
    amendedBy: W-277
    note: 'grouped under, no ownership, so includes/includedIn rather than hasChild (W-277); regions of countries 278, Physical Context 57, about 30 real shared parts; Post-Import Task 7'
  precedence: 'an existing link on the pair (folded Part hasPart, W-136, or ParentID placement, W-149) wins and the connector writes nothing: 1,837 connectors (composite 1,551, shared 286)'
  counts: '451 connectors add 450 new links: hasPart 77, hasChild 373 counted before W-277 moved shared aggregation to includes (split to be recounted by the planner); no self-loops, no pair drawn both ways, no pair with both composite and shared'
  mixedTypes:
    reviewLine: 'REVIEW hasChild: the two notes have different types'
    where: 'Source: EA section of the whole'
    counts: '23 links on 15 notes'
  fields: 'SourceCard is the quantity line on the assembly (W-43, W-54; 52); SourceRole archived (W-56); Name uses the W-158 line on the whole (4); DestIsAggregate chooses the rule and stays in the export'
- eaConnectorType: Realisation
  connectors: 950
  decision: W-384
  status: settled
  rules:
  - pair: Object to Requirement, or Requirement to Object
    field: appliesTo
    writtenOn: 'the Requirement, pointing at the governed target'
  - pair: Behavior to Use Case
    field: realizedBy
    writtenOn: 'the Use Case; realizes generated on the Behavior'
  - pair: any other
    field: realizedBy
    review: true
  note: 'Relationship name is retained; endpoint validity is governed by relationships.yaml 1.36.'
- eaConnectorType: NoteLink
  connectors: 349
  decision: W-161
  status: settled
  matrixRule: 'Rule 45 (r12 matrix), replaced'
  rules:
  - case: note linked to one element
    notes: 247
    connectors: 250
    result: 'the note text is written into the element body; no Info note (amends W-145). The accepted v0.2 whole-model plan shows 247 unique Note elements represented by 250 folded NoteLink connector rows; W-274 corrects the earlier count without changing the W-161 rule.'
  - case: note linked to several elements
    notes: 38
    result: 'Info note (W-145) with describes to each element, describedBy generated; 94 links; field always on the note'
  - case: note to note
    connectors: 2
    result: 'describes in the drawn direction between the two Info notes (my reading)'
  bodyFormat: 'after the comment texts, before the user section: label **EA notes:** then one bullet per note in EA creation order, "- <yyyy-MM-dd>, <author>: <text>" (W-162, Definitions/Note Layout.md item 5)'
  notDecided:
  - 'the canvas text card for the 225 folded notes drawn on diagrams (W-73)'
- eaConnectorType: Dependency
  connectors: 6762
  decision: W-384
  status: settled
  stereotypes:
  - stereotype: satisfy
    rules:
    - {pair: 'Behavior or Condition to Requirement', field: satisfies}
    - {pair: 'any other', field: satisfies, review: true}
  - stereotype: deriveReqt
    rules:
    - {pair: 'Requirement to Requirement', field: derivedFrom}
    - {pair: 'any other', field: derivedFrom, review: true}
  - stereotype: refine
    rules:
    - {pair: 'Requirement to Requirement', field: refines}
    - {pair: 'Use Case to Requirement', field: drives}
    - {pair: 'Info or Artifact to Requirement', field: describes}
    - {pair: 'any other', field: refines, review: true}
  - stereotype: trace
    rules:
    - {pair: 'Info or Artifact to any', field: describes}
    - {pair: 'Object to Info', field: describes}
    - {pair: 'Issue to any', field: affects}
    - {pair: 'Object and Requirement, either direction', field: appliesTo}
    - {pair: 'Requirement to Requirement', field: references}
    - {pair: 'any other', field: tracesTo, review: true}
  - stereotype: verify
    rules:
    - {pair: 'Verification to Requirement', field: verifies}
    - {pair: 'any other', field: verifies, review: true}
  - stereotype: RecoveryRequirement
    rules:
    - {pair: 'Behavior or Condition to Requirement', field: satisfies, review: true}
  - stereotype: ASILDecompose
    rules:
    - {pair: 'Requirement to Requirement', field: derivedFrom, review: true}
  - stereotype: none
    rules:
    - {pair: 'Behavior to Behavior or Condition', field: dependsOn}
    - {pair: 'Artifact to Requirement', field: describes}
    - {pair: 'Requirement to Requirement', field: references}
    - {pair: 'Requirement and Object, either direction', field: appliesTo}
    - {pair: 'Issue to any', field: affects}
    - {pair: 'Object to Info', field: describes}
    - {pair: 'any other', field: dependsOn, review: true}
  note: 'W-384 retargets the existing semantic fields from Function/Design/State classes to Behavior/Condition; no relationship name is introduced solely for the taxonomy migration.'
- eaConnectorType: Abstraction
  connectors: 2811
  decision: W-384
  status: settled
  stereotypes:
  - stereotype: allocate
    rules:
    - {pair: 'Behavior to Object', field: performs, writtenOn: Object}
    - {pair: 'Condition/design to Object', field: hasDesign, writtenOn: Object}
    - {pair: 'Issue to any', field: affects}
    - {pair: 'Info or Artifact to any', field: describes}
    - {pair: 'Requirement and Object, either direction', field: appliesTo}
    - {pair: 'any other', field: tracesTo, review: true}
  - stereotype: Refine
    rules:
    - {pair: 'Use Case to Requirement', field: drives}
  - stereotype: Derive
    rules:
    - {pair: 'Requirement to Requirement', field: derivedFrom}
    - {pair: 'any other', field: derivedFrom, review: true}
  - stereotype: trace
    rules:
    - {pair: 'Requirement to Requirement', field: references}
    - {pair: 'Object to Requirement', field: appliesTo}
    - {pair: 'Object to Artifact', field: describes}
    - {pair: 'any other', field: tracesTo, review: true}
  note: 'Object performs Behavior; Object/Document hasDesign Condition/design. Endpoint validity remains governed by relationships.yaml 1.36.'
- eaConnectorType: UseCase
  connectors: 1258
  decision: W-171
  status: settled
  matrixRule: 'Rules 30, 31, 60, 61'
  direction: '8 connectors are marked Destination -> Source; the tool follows Direction (W-51)'
  exception: '1 connector with an end missing from the export writes nothing (Rule 71)'
  stereotypes:
  - stereotype: extend
    connectors: 736
    rules:
    - pair: Use Case to Use Case
      connectors: 733
      field: optionOf
      writtenOn: 'the extending (source) Use Case, pointing at the base; hasOption generated'
    - pair: Issue to Use Case
      connectors: 2
      field: affects
      writtenOn: 'the Issue (W-166)'
  - stereotype: include
    connectors: 522
    rules:
    - pair: Use Case to Use Case
      connectors: 521
      field: hasChild
      writtenOn: 'the including (source) Use Case; childOf generated; 47 repeat a placement link and add nothing, 473 new links'
      note: 'kept as hasChild (W-278): EA modeling did not separate ownership from membership, so each link is reviewed after import and becomes includes where the included Use Case is shared (Post-Import Task 7, item 13)'
    - pair: Use Case to Object
      connectors: 1
      field: hasChild
      reviewLine: 'REVIEW hasChild: the two notes have different types'
- eaConnectorType: Association
  connectors: 603
  decision: W-384
  status: settled
  rules:
  - pair: Use Case with an Object, Actor or Behavior
    field: participants
    writtenOn: 'the Use Case only; one-way'
  - {pair: 'Issue with any', field: affects}
  - {pair: 'Info or Artifact with an Object', field: describes}
  - {pair: 'any other', field: tracesTo, review: true}
  note: 'Local Interface occurrences are contextual Local Model records and are not represented as note-level Use Case participants under the first-class relationship schema.'
- eaConnectorType: Usage
  connectors: 239
  decision: W-384
  status: settled
  rules:
  - {pair: 'Use Case to Behavior or Condition', field: realizedBy}
  - {pair: 'Requirement to Requirement', field: dependsOn}
  - {pair: 'Issue to Condition', field: affects}
  - {pair: 'any other', field: dependsOn, review: true}
- eaConnectorType: ControlFlow
  connectors: 407
  decision: W-174
  status: settled
  matrixRule: 'Rule 44, replaced'
  rules:
  - pair: any
    connectors: 407
    field: precedes
    writtenOn: 'the step before, pointing at the step after; follows generated; no review line; 5 self-loops kept'
  guard: '"- Guard: <value> (to [[next step]])" on the step before; 24 connectors (PDATA2 6, Top_End_Label 18)'
  name: 'W-158 line on the step before (31)'
- eaConnectorType: StateFlow
  connectors: 200
  decision: W-175
  status: settled
  matrixRule: 'Rule 47, replaced'
  rules:
  - pair: any
    connectors: 200
    field: precedes
    writtenOn: 'the state before, pointing at the next state; follows generated; no review line; Transition is not a class (W-237)'
  lines: '"- Trigger: <value> (to [[next state]])" PDATA1 42; "- Guard: ..." PDATA2 27; "- Effect: ..." PDATA3 2; on the state before'
  name: 'W-158 line on the state before (10)'
- eaConnectorType: Sequence
  connectors: 199
  decision: W-176
  status: settled
  matrixRule: 'Rule 43'
  rule: 'no relationship field; the diagram companion note (W-73) lists the messages under **Messages:** in SeqNo order, "<SeqNo>. [[sender]] → [[receiver]]: <message name>"; Notes (4) as an indented line under the message; DiagramID places the message (W-61)'
- eaConnectorType: InformationFlow
  connectors: 123
  decision: W-384
  status: settled
  rules:
  - pair: Local Interface to Local Interface
    result: 'Use or create the specific Local Model Connection carrying the flow; do not write note-level interfaces.'
  - pair: conveys an item
    result: 'Create a Local Model Flow under the carrying Connection with definition pointing to the reusable Item Flow and endpoint roles transmit/receive/exchange/unspecified.'
  - pair: unresolved or non-local endpoint pattern
    field: tracesTo
    review: true
  note: 'W-384 removes the Port-note interfaces/transmits/receives/exchanges summary. Exact occurrence-level connection/flow topology is authoritative.'