    - "99_System/10_Docs/00 - Current State.md"
    - "99_System/10_Docs/Translator Definition.md"
    - "99_System/10_Docs/Workspace Decision Log.md"
    - "99_System/CSV_EA"
    - "99_System/archive"
    - "MDSE Workbench"
    - "MDSE Bootstrap"
    - "99_System/09_Tools/runtime-plugins"

