# MDSE release manifest (W-320, W-321, W-322).
# Single machine-readable authority for release alignment and the lean runtime-base build.
# This file stays in the methodology workspace; it is NOT copied into generated engineering vaults.
# Verify with:
#   python3 99_System/09_Tools/check-release.py [--workbench <path>] [--base <path>]
manifestVersion: 2
mdseRelease: "0.8.0"
releaseStatus: pre-release
date: "2026-10-02"
sourceModelId: EA8647

schemas:
  relationships: "1.35"
  elementTypes: "1.17"
  localModel: "0.2"

ruleset: "99_System/10_Docs/MDSE Modeling Ruleset 1.23.md"

limits:
  maxGeneratedPathLength: 212
  maxModelFilesPerFolder: 75
  duplicateMarker: "~2"
  alterationMarker: "~a"

tools:
  importer:
    release: null
    candidate: "99_System/09_Tools/EA_to_MDSE_Native_Importer/v0.8.0/EA_to_MDSE_Native_Importer_v0.8.0.html"
    acceptedFallback: "99_System/09_Tools/EA_to_MDSE_Native_Importer_v0.5.2.html"
    evidenceOnly: "99_System/09_Tools/EA_to_MDSE_Native_Importer_v0.7.html"
  cleanBase:
    repo: null
    builder: "99_System/09_Tools/build-base.py"
    obsoleteReference: "spencerskelly/Test_Vault_-base-vault-2026-09-30-rel133-v051"
  workbench:
    repo: "spencerskelly/MDSE_Workbench"
    version: "0.1.15"                               # pinned in plugin-lock.yaml for pre-release bases
    nextGate: "WB-106"
    wb106Version: null                              # set to the first WB-106-capable release; required for releaseStatus: release
    runtimePluginId: "mdse-workbench"
    requiredForRelease: true
    fixturesFrom: "99_System/03_Schemas"
  bootstrap:
    status: active                                  # rebuilt by W-322 (replaces the unavailable 0.2.0 of W-321)
    version: "0.3.0"
    source: "MDSE Bootstrap/plugin"               # docs and specs: MDSE Bootstrap/
    sourceAvailable: true
    role: "controlled-release check against plugin-lock.yaml; author registration (Author Registration Spec)"

# W-322: controlled plugin release. Every runtime plugin ships inside the base, pinned and hashed.
runtimePlugins:
  lock: ".obsidian/plugin-lock.yaml"                # generated by update-plugin-lock.py; runtime authority
  enabledList: ".obsidian/community-plugins.json"   # generated with the lock
  payload: "99_System/09_Tools/runtime-plugins"     # vendored/built plugin files + governed data.json
  configGenerator: "99_System/09_Tools/build-plugin-config.py"
  lockGenerator: "99_System/09_Tools/update-plugin-lock.py"

repos:
  authority: "spencerskelly/Test_Vault_"
  workbench: "spencerskelly/MDSE_Workbench"
  referenceOnly:
    - "spencerskelly/20260930"
    - "spencerskelly/261001"
    - "spencerskelly/Test_Vault_-base-vault-2026-09-30-rel133-v051"

# W-321: the engineering vault is a lean runtime artifact, not another methodology workspace.
# Positive include lists avoid carrying workspace-only material accidentally.
runtimeBase:
  policy: lean
  copyReleaseManifest: false
  copyCurrentState: false
  generatedFiles:
    - ".vault.yaml"
    - "README.md"
    - ".gitignore"                                  # base policy: governed plugin settings are tracked
  includeFiles:
    - ".gitattributes"
    - "AGENTS.md"
    - ".obsidian/app.json"
    - ".obsidian/appearance.json"
    - ".obsidian/community-plugins.json"
    - ".obsidian/core-plugins.json"
    - ".obsidian/plugin-lock.yaml"
    - ".obsidian/templates.json"
    - ".obsidian/types.json"
    - "99_System/01_Admin/Enabled Plugin Stack.md"
    - "99_System/03_Schemas/authors.yaml"
    - "99_System/03_Schemas/element-types.yaml"
    - "99_System/03_Schemas/local-model.yaml"
    - "99_System/03_Schemas/relationships.yaml"
    - "99_System/09_Tools/Initialize-Vault.ps1"
    - "99_System/09_Tools/Initialize-Vault.sh"
    - "99_System/10_Docs/MDSE Modeling Ruleset 1.23.md"
  includeTrees:
    - "Definitions"
    - "99_System/02_AI"
    - "99_System/04_People"
    - "99_System/05_Templates"
    - "99_System/06_Fileclasses"
    - "99_System/08_Scripts"
  conditionalFiles:
    - "99_System/09_Tools/EA_to_MDSE_Native_Importer/v0.8.0/EA_to_MDSE_Native_Importer_v0.8.0.html"
  forbiddenPaths:
