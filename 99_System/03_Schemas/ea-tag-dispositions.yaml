# Disposition of every EA tagged value (tag) for the translator (Workspace Decision Log W-33).
# disposition: property | body | structure | archive | drop   (pending = not yet decided; if it stays undecided it defaults to body)
#   property   a property in the note's frontmatter
#   body       a line below the EA GUID in the note body (Definitions/EA Source Section)
#   structure  used by the translator to build something (a title, id, link or placement); the rule that used it is recorded in the ledger; not put on the note
#   archive    stays in the original export only, not in the note
#   drop       not kept anywhere
# The source reference is a ledger keyed by EA GUID plus a run manifest; values are not copied (W-35).
# populated = rows with any value; realValues = rows with a value other than the placeholders unassigned and <memo>.
