# Mapping of EA element types to the vault, for stage 1 of the import (Workspace Decision Log W-30, W-32).
# One entry per EA object type, largest first, walked through one at a time. Nothing here is approved until `disposition` is set and `decision` names the log entry.
# disposition: pending | note | fold | archive | drop
#   note     the element becomes a note with the MDSE `type` (and `subtype`) given in mdseType
#   fold     the element's content goes into another note (say which)
#   archive  kept only in the import archive, not in the vault
#   drop     not carried over
# oldToolRules is evidence only: what the earlier semantic translator (v2.6.0) did with this type, from its embedded rules. It is a starting point for discussion, not a decision.
schemaVersion: '1.0'
elementTypes:
- eaObjectType: Requirement
  elements: 13988
  stereotypes:
    requirement: 7648
    Regulatory Requirement: 3363
    Webasto Requirement: 1485
    designConstraint: 733
    functionalRequirement: 514
    (none): 170
    extendedRequirement: 71
    Functional: 2
    performanceRequirement: 1
    physicalRequirement: 1
  disposition: note
  mdseType: Requirement
  decision: W-115
  subtypeRule:
    basis: EA package path of the element, first match wins (old tool rule R-01, D-049, with W-115 changes)
    engineering: 03 Product Requirement / Engineering Requirements
    standard: 03 Product Requirement / Regulatory Requirements
    design: [03 Product Requirement / Design Guides, 05 Product Design]
    functional: 04 Product Function
    stakeholder: any other package
    stereotypeOverride: functionalRequirement gives functional and designConstraint gives design, except inside Engineering Requirements, where every element is engineering (W-116)
  oldToolRules:
  - rule: R-02
    verdict: fold
    target: imported document anchor
  - rule: R-03
