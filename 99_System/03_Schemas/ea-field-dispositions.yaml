# Disposition of every EA source field for the translator (Workspace Decision Log W-33, W-39).
# disposition: property | body | structure | archive | drop   (pending = not decided yet)
# proposedByHandoff is the suggestion from the handoff package (EA_Native_Translator_Handoff_2026-09-28), rewritten in our five words.
# It is NOT a decision. Where the handoff shows two words (for example "body / structure") it was unsure.
# "open question" means the handoff marked it REVIEW.
# nonblank = rows with a real (not empty, not 0) value in the extract; tObject counts exclude package rows.
# placement (only on body): main text | source section | attachment. main text is the note's own description at the top of the body; source section is a line below the EA GUID (the default when placement is missing); attachment is a file next to the note (W-42, W-76).
# Sections: tObject, tConnector, tPackage (fields, W-33 to W-66); tDiagram, tDiagramObjects, tDiagramLinks (W-67 to W-73); emptyTables (W-74); tDocument (W-75, W-76); tXref (W-79 to W-84); tConnectorTag (W-85); tSmallTables (W-86).
# Added in W-108 (sweep): tSmallColumns (column dispositions for t_attribute and t_operation), tXrefColumns, tDocumentColumns, sourceFiles (role of every file in CSV_EA).
# Still pending, set aside in W-96 for the element mapping: tObject Classifier, Classifier_guid and PDATA1 (decided for Parts only, W-44). Tags are in ea-tag-dispositions.yaml.
