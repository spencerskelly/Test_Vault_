# Disposition of every EA source field for the translator (Workspace Decision Log W-33, W-39).
# disposition: property | body | structure | archive | drop   (pending = not decided yet)
# proposedByHandoff is the suggestion from the handoff package (EA_Native_Translator_Handoff_2026-09-28), rewritten in our five words.
# It is NOT a decision. Where the handoff shows two words (for example "body / structure") it was unsure.
# "open question" means the handoff marked it REVIEW.
# nonblank = rows with a real (not empty, not 0) value in the extract; tObject counts exclude package rows.
