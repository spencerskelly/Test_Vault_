guidance:
  connector: 'interfaces and equals are symmetric fields written on both end notes (W-153). equals is temporary and is resolved after the import (Post-Import Task 8).'
  refine: 'refines/refinedBy is between two requirements: the source requirement adds precision to the target (W-165).'
  drives: 'drives/drivenBy links an element to the requirement it gives rise to: drives is written on the element, drivenBy generated on the requirement. First used for Use Case to Requirement (W-165); Spencer intends it for other relationships to requirements later.'
  references: 'references/referencedBy: one note mentions another, written on the note that mentions it. First used for requirements that mention other requirements (W-167); general enough for a requirement that cites a standard clause or a document.'
  participants: 'participants is one-way, written only on the Use Case, listing the Objects, Actors, Functions and Ports that take part in it; nothing is written back on them, so their properties are not overloaded (W-172). hasParticipant/participatesIn stays the paired field for a Context (Post-Import Task 7).'
  precedes: 'precedes/follows is the order of steps in a flow: precedes is written on the step before, pointing at the step after; follows is generated. Used for EA ControlFlow (W-174) and StateFlow (W-175); a guard, trigger or effect is a source-section line on the step before.'
  data: 'transmits, receives and exchanges say what data a Port sends, takes in, or both, and point at the Item Flow note for that data (W-177). The Port already connects to something (interfaces); these fields define what is exchanged with it. transmits is the source or out end, receives the target or in end; for an inout flow both Ports get exchanges. One-way: nothing is written back on the Item Flow note, which shows the Ports in its backlinks and can be queried.'
  tracesTo: Migration/legacy escape hatch only. Prefer stronger semantic relationships.
  source_target: source/target are shared vocabulary for Item Flow and Transition.
  composition: 'hasPart/partOf is for Object notes only, the assembly and block relationship (W-149). hasChild/childOf is the generic parent and child link for every other nesting, written on the owner; it carries the EA owner (ParentID) of an element (W-149) and the 252 independent Nesting connectors (W-151); no placement link is written where the child is subtypeOf its owner (W-178).'
  flow: 'hasFlow/flowOf is ownership: a Port note has the Item Flow notes made from its pins; direction is carried by source/target on the Item Flow note (W-133).'
  copy: copyOf/hasCopy says a note is a copy of another element and lets a reader trace back to the original note. It is general, not limited to Ports (W-124).
  crossVault: Relationship semantics do not change across vault boundaries. Store durable note references by uid when the target is in another vault.
