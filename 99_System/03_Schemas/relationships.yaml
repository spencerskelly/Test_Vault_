schemaVersion: '1.3'
date: '2026-09-29'
storage: Author forward/owner-side fields. Inverse fields are generated, persisted in YAML, and may be safely regenerated by Nodian.
paired:
- {forward: subtypeOf, inverse: supertypeOf}
- {forward: hasPart, inverse: partOf}
- {forward: hasPort, inverse: portOf}
- {forward: dependsOn, inverse: dependencyOf}
- {forward: derivedFrom, inverse: derivedBy}
- {forward: supersedes, inverse: supersededBy}
- {forward: describes, inverse: describedBy}
- {forward: tracesTo, inverse: tracesFrom}
- {forward: instanceOf, inverse: hasInstance}
- {forward: performs, inverse: performedBy}
- {forward: hasDesign, inverse: designOf}
- {forward: hasStateMachine, inverse: stateMachineOf}
- {forward: hasContext, inverse: contextOf}
- {forward: hasBehavior, inverse: behaviorOf}
- {forward: appliesTo, inverse: applies}
- {forward: satisfies, inverse: satisfiedBy}
- {forward: verifies, inverse: verifiedBy}
- {forward: subject, inverse: subjectOf}
- {forward: hasParticipant, inverse: participatesIn}
- {forward: realizedBy, inverse: realizes}
- {forward: optionOf, inverse: hasOption}
- {forward: connects, inverse: connectedBy}
- {forward: carries, inverse: flowsOn}
- {forward: source, inverse: sourceOf}
- {forward: target, inverse: targetOf}
- {forward: hasState, inverse: stateOf}
- {forward: hasTransition, inverse: transitionOf}
- {forward: startState, inverse: startStateOf}
- {forward: endState, inverse: endStateOf}
- {forward: operatingState, inverse: operatingStateOf}
- {forward: exercises, inverse: exercisedBy}
- {forward: addresses, inverse: addressedBy}
- {forward: affects, inverse: affectedBy}
- {forward: causes, inverse: causedBy}
- {forward: usesSetup, inverse: usedByPlan}
- {forward: resultOf, inverse: hasResult}
- {forward: hasEvidence, inverse: evidenceFor}
symmetric:
- field: conflictsWith
  meaning: Mutual compatibility conflict; generated mirror is derivative.
oneWay:
- sequence
- initialState
- finalState
- trigger
- plannedDUTs
- scopeRequirements
- dut
- equipmentUsed
- providesSource
- providesLoad
- providesMeter
- providesInterfaceEquipment
- providesEnvironment
- providesFixture
- requiresSource
- requiresLoad
- requiresMeter
- requiresInterfaceEquipment
- requiresEnvironment
- requiresFixture
guidance:
  tracesTo: Migration/legacy escape hatch only. Prefer stronger semantic relationships.
  source_target: source/target are shared vocabulary for Item Flow and Transition.
  composition: hasPart/partOf is the generic composition vocabulary.
  crossVault: Relationship semantics do not change across vault boundaries. Store durable note references by uid when the target is in another vault.
